name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (no Ollama; the retrieval test skips itself)
        run: pytest
