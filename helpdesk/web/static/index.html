<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic Helpdesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <div class="brand-title">Academic Helpdesk</div>
          <div class="brand-sub">IIT Jodhpur</div>
        </div>
      </div>
      <button class="new-chat" id="newChat">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        New chat
      </button>
      <nav class="chat-list" id="chatList"></nav>
      <div class="sidebar-foot">
        <div class="seg mode-seg" id="modeSeg">
          <button class="seg-btn" data-mode="single" title="One agent with every tool">Single agent</button>
          <button class="seg-btn" data-mode="multi" title="Router hands off to policy, schedule and email agents">Multi-agent</button>
        </div>
        <div class="model-name" id="modelInfo">…</div>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <button class="icon-btn mobile-only" id="toggleSidebar" aria-label="Chats">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="chat-title" id="chatTitle">New chat</div>
        <button class="icon-btn" id="togglePanel" aria-label="Sources and graph">
          <svg viewBox="0 0 16 16" width="16" height="16"><rect x="2" y="2.5" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 2.5v11" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </header>

      <div class="messages" id="messages"></div>

      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Ask about regulations, courses, slots, exams… or ask for an email draft"></textarea>
        <button type="submit" id="send" aria-label="Send">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </main>

    <aside class="panel" id="panel">
      <div class="tabs">
        <button class="tab active" data-tab="sources">Sources</button>
        <button class="tab" data-tab="graph">Graph</button>
        <button class="tab" data-tab="unanswered">Unanswered <span class="tab-count hidden" id="openCount"></span></button>
      </div>
      <section class="tab-body" id="tab-sources"></section>
      <section class="tab-body hidden" id="tab-unanswered"></section>
      <section class="tab-body hidden" id="tab-graph">
        <div class="graph-tools">
          <div class="seg">
            <button class="seg-btn active" data-scope="local">This chat</button>
            <button class="seg-btn" data-scope="global">All documents</button>
          </div>
          <button class="icon-btn" id="expandGraph" aria-label="Expand graph">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="graph" id="graph"></div>
        <div class="legend" id="legend"></div>
      </section>
    </aside>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="overlay-box">
      <button class="icon-btn close" id="closeOverlay" aria-label="Close">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="graph" id="graphBig"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="graph.js"></script>
  <script src="app.js"></script>
</body>
</html>
